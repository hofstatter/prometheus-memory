# supervisord — 5 processos do Prometheus (P6)
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:prometheus-web]
command=gunicorn -w 2 -b 0.0.0.0:8777 app:app
directory=/app
user=herbert
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:mnemosyne-mcp]
command=mnemosyne mcp --transport sse --host 0.0.0.0 --port 8765
directory=/app
user=herbert
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:mnemosyne-api]
command=python3 /app/scripts/mnemosyne_api.py
directory=/app
user=herbert
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:telemetry]
command=/bin/bash -c "while true; do python3 /app/telemetry_collector.py; sleep 300; done"
directory=/app
user=herbert
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:cron]
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
