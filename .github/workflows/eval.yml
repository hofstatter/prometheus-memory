name: longmemeval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"   # domingo 4h — eval completo semanal
  push:
    branches: [main]
    paths:
      - "web/memory.py"
      - "web/entity_store.py"
      - "web/dedup.py"
      - "web/extractor.py"
      - "evals/**"
      - "scripts/llm_backend.py"
      - ".github/workflows/eval.yml"

jobs:
  longmemeval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install sqlite-vec fastembed
      - name: Cache dataset LongMemEval (277MB, gitignored)
        uses: actions/cache@v4
        with:
          path: evals/data/longmemeval_s_cleaned.json
          key: longmemeval-s-cleaned-v1
      - name: Download dataset
        run: |
          mkdir -p evals/data
          if [ ! -f evals/data/longmemeval_s_cleaned.json ]; then
            curl -sL -o evals/data/longmemeval_s_cleaned.json \
              "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json"
          fi
          ls -la evals/data/
      - name: Run LongMemEval (report-only — não quebra o build)
        continue-on-error: true
        run: python3 evals/longmemeval_runner.py --subset 100
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: REPORT_LONGMEMEVAL
          path: evals/REPORT_LONGMEMEVAL.md
